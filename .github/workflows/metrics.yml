name: Metrics
on:
  # Schedule updates (each hour)
  schedule: [{ cron: "0 * * * *" }]
  # Lines below let you run workflow manually and on each commit
  workflow_dispatch:
  push: { branches: ["main"] }
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Your GitHub token
          # The following scopes are required:
          # - public_access (default scope)
          # The following additional scopes may be required:
          # - read:org (for organization related metrics)
          # - read:user (for user related data)
          # - read:packages (for some packages related data)
          # - repo (optional, if you want to include private repositories)
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          user: yangwenjie1231
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Shanghai

          # ---------------------------------------------------------------
          # 语言分布
          # ---------------------------------------------------------------
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_other: yes
          # 排除噪音仓库，否则统计严重失真。四类：
          #   1. fork 的上游仓库 —— 代码不是自己写的
          #   2. sg2002_rvv 内嵌了整份 RISC-V gcc sysroot + SDK（C 会被撑到 94MB）
          #   3. 早年把整包资源塞进 git 的 HTML 小游戏（game / ywjgame）
          #   4. 纯数据仓库（Technical_Data / picx-images-hosting）与本 profile 仓库
          #
          # 另外必须列全私有仓库：METRICS_TOKEN 带 repo scope 时，语言统计会把
          # 私有仓库的代码量也算进去，虽然没有仓库名，但像 "TeX 8.86%" 这种
          # 冷门语言占比会暴露私有项目的内容构成（实测来自 multiagent-collab-eval
          # 与 hermes-agent-workspace-backup 的论文/排版文件）。
          plugin_languages_skipped: MaaEnd, MaixPy, sipeed_wiki, picoclaw_old, AgentHub, claude-code-sourcemap, 6706-2026-test, picx-hsf, picx-images-hosting, onedrive-vercel-index, voc-yolo, ChatMap, license, je_score_operator, sophgo-sg200x-debian, sg2002_rvv, game, ywjgame, Technical_Data, yangwenjie1231, acrylic-charm-dxf, multiagent-collab-eval, hermes-agent-workspace-backup, xmusic, Cell-Vision-Pro, agent-workspace, magenta-realtime, groupD2025, 2, ai-trip, kechuang2024
          plugin_languages_ignored: markdown, jupyter notebook

          # ---------------------------------------------------------------
          # 全年提交日历热图
          # ---------------------------------------------------------------
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # 注：plugin_habits 暂未启用 —— 当前上游版本在遇到 author 为空的
          # commit 时会抛 TypeError: Cannot destructure property 'author' of
          # 'undefined'，整块渲染成 "Unexpected error"。等上游修复后再加。
